# Checks pull requests to develop and main with the same commands as on a developer's machine
# (scripts/dev.py, see AGENTS.md), and develop after each merge, so that the coverage badges and the
# caches have its figures. It can also be run by hand from the Actions tab.
#
# - A change that only touches Markdown files runs nothing.
# - A draft pull request only runs the Linux jobs (the Windows jobs start with "Ready for review").
# - A new push to the same pull request cancels the run that is still going.
# - Every action is pinned by commit SHA, with its version in a comment (OpenSSF Scorecard,
#   CodeQL): a moved tag can't change what runs. Dependabot updates them.
name: CI

on:
  pull_request:
    branches: [develop, main]
    # The default types, plus ready_for_review: from draft to ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md"]
  push:
    branches: [develop]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # On develop every merge keeps its run, so that each one uploads its coverage.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage (Debug, clang-tidy)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-windows
        with:
          llvm: "true"
          opencppcoverage: "true"
          cache-key: tests
      - name: Build and test
        run: python scripts/dev.py test
      - name: Coverage
        run: python scripts/dev.py coverage
      # A Codecov failure doesn't fail the job: the coverage is also in the job summary.
      - name: Upload the coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/Windows x64 Debug/coverage/cobertura.xml
          flags: windows
          name: windows
          disable_search: true
          plugins: noop # the report is ready: no gcov, Xcode or coverage.py
          fail_ci_if_error: false
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-windows
          path: build/Windows x64 Debug/coverage/html
          retention-days: 14
          if-no-files-found: ignore

  asan:
    name: Tests with AddressSanitizer
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-windows
        with:
          cache-key: asan
      - name: Build and test with AddressSanitizer
        run: python scripts/dev.py asan

  msbuild:
    name: Visual Studio project (MSBuild)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-windows
        with:
          llvm: "true"
          cache-key: msbuild
      - name: Rebuild Debug (clang-tidy) and Release
        run: python scripts/dev.py msbuild

  linux:
    name: Linux tests, sanitizers and coverage (gcc, clang-tidy)
    # Also in drafts: Linux minutes are cheap, and they test the pull request before the Windows jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: linux
      - name: Build and test
        run: python scripts/dev.py test
      # Another build, without clang-tidy: the "Linux GCC Debug Sanitizers" preset.
      - name: Build and test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: python scripts/dev.py asan
      # Another build, with --coverage and without clang-tidy (the "Linux GCC Coverage" preset).
      - name: Coverage
        run: python scripts/dev.py coverage
      # A Codecov failure doesn't fail the job: the coverage is also in the job summary.
      - name: Upload the coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/Linux GCC Coverage/coverage/cobertura.xml
          flags: linux
          name: linux
          disable_search: true
          plugins: noop # the report is ready: no gcov, Xcode or coverage.py
          fail_ci_if_error: false
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-linux
          path: build/Linux GCC Coverage/coverage/html
          retention-days: 14
          if-no-files-found: ignore

  pre-commit:
    name: pre-commit
    # The hooks don't depend on the platform, and Linux minutes are cheaper.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run the hooks
        run: |
          # An exact version, from wheels only (SonarQube Cloud: githubactions:S8544, S8541).
          python -m pip install --disable-pip-version-check --only-binary :all: "pre-commit==4.7.0"
          pre-commit run --all-files --show-diff-on-failure
        env:
          # It protects local branches; in a pull request the checkout is not on a branch.
          SKIP: no-commit-to-branch
