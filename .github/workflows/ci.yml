# Checks every pull request to develop and main with the same commands as on a developer's machine
# (scripts/dev.py, see AGENTS.md). It can also be run by hand from the Actions tab.
#
# The repository is private: Windows minutes count double, so the jobs run in parallel and a new
# push to the same pull request cancels the run that is still going.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage (Debug, clang-tidy)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-windows
        with:
          llvm: "true"
          opencppcoverage: "true"
          cache-key: tests
      - name: Build and test
        run: python scripts/dev.py test
      - name: Coverage
        run: python scripts/dev.py coverage
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/Windows x64 Debug/coverage/html
          retention-days: 14
          if-no-files-found: ignore

  asan:
    name: Tests with AddressSanitizer
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-windows
        with:
          cache-key: asan
      - name: Build and test with AddressSanitizer
        run: python scripts/dev.py asan

  msbuild:
    name: Visual Studio project (MSBuild)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-windows
        with:
          llvm: "true"
          cache-key: msbuild
      - name: Rebuild Debug (clang-tidy) and Release
        run: python scripts/dev.py msbuild

  pre-commit:
    name: pre-commit
    # The hooks don't depend on the platform, and Linux minutes are cheaper.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run the hooks
        run: |
          python -m pip install --disable-pip-version-check pre-commit
          pre-commit run --all-files --show-diff-on-failure
        env:
          # It protects local branches; in a pull request the checkout is not on a branch.
          SKIP: no-commit-to-branch
