# OpenSSF Scorecard: scores the repository's security practices (pinned dependencies, token
# permissions, branch protection, ...), not the code. Its findings go to the Security tab, as
# CodeQL's, and the published score feeds a public API and badge. See
# docs/analysis/quality-tools.md.
#
# Publishing has rules (https://github.com/ossf/scorecard-action#workflow-restrictions): no
# workflow-level write permissions or environment variables, an Ubuntu runner, and only a few
# allowed actions. It only publishes from the default branch: on pull requests (an experimental
# trigger) it only analyzes.
name: Scorecard

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "17 6 * * 1" # Mondays, as some checks depend on time (e.g. the maintenance activity)

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # Upload the results to code scanning.
      id-token: write # Publish the results (badge and API).
    steps:
      # Third-party and GitHub actions pinned by commit SHA, as Scorecard asks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Upload the results as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - name: Upload the results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
