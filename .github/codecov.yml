# Codecov settings (https://docs.codecov.com/docs/codecov-yaml). The CI uploads one Cobertura report
# per system (.github/workflows/ci.yml), each with its own flag: they measure different lines
# (OpenCppCoverage and gcovr), so each one has its own badge.
flags:
  # A draft pull request only runs the Linux job: each flag keeps its last report until the next
  # upload, instead of showing as missing.
  windows:
    carryforward: true
  linux:
    carryforward: true

coverage:
  status:
    # Informational: the coverage shows in the pull request, but doesn't block it. The figure
    # shouldn't drop (see "Testing > Coverage" in AGENTS.md).
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags, condensed_files"

parsers:
  cobertura:
    # Lines only, as the project measures (see AGENTS.md): gcovr's report also has the branches of
    # each line, and Codecov would count a line with a branch not taken as not covered (79% instead
    # of 99.6% on Linux).
    partials_as_hits: true
