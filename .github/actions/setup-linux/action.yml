# Installs what scripts/dev.py needs on a GitHub-hosted Linux runner. gcc comes with the runner.
name: Set up the Linux build
description: Python, Conan 1, CMake 3, Ninja, gcovr, LLVM 23 (clang-tidy) and ccache.

inputs:
  cache-key:
    description: Name of this job's ccache cache.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        # Conan 1.61 is older than Python 3.12, so the CI stays on 3.11.
        python-version: "3.11"

    # The same versions as on the developers' machines (see AGENTS.md, "Setup"), exact so that a new
    # release can't change the CI by itself (SonarQube Cloud: githubactions:S8544). CMake stays on
    # 3.x, as on Windows: the runner may bring CMake 4. Dependabot doesn't update these versions.
    # Wheels only, so that no package runs its own setup scripts (S8541), except Conan 1: it is only
    # published as source. That finding is accepted until the migration to Conan 2, which has wheels.
    - name: Install Conan 1, CMake, Ninja and gcovr
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --only-binary :all: "cmake==3.31.10" \
          "ninja==1.13.2" "gcovr==8.8"
        python -m pip install --disable-pip-version-check "conan==1.61.0"
        conan profile new default --detect --force

    - name: Cache the Conan packages (GoogleTest)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.conan/data
        key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}

    - name: Install LLVM 23 (clang-tidy)
      shell: bash
      run: |
        target="$RUNNER_TEMP/llvm"
        python -m pip install --disable-pip-version-check --no-deps --target "$target" "clang-tidy==23.1.4"
        echo "LLVM_TOOLS_DIR=$target/clang_tidy/data/bin" >> "$GITHUB_ENV"

    # ccache only caches the compiler; clang-tidy still runs on every file.
    - name: Install ccache
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ccache
        echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

    - name: Cache the compiled objects (ccache)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.cache-key }}-
